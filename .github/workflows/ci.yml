name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv run --locked cloakroom --help
      - run: uv run --locked cloakroom --version
      - run: uv run --locked python -m cloakroom --help
      - run: uv build
      - name: Install and run the wheel in isolation
        shell: pwsh
        run: uv run --isolated --no-project --with (Get-Item -Path dist/*.whl).FullName cloakroom --version

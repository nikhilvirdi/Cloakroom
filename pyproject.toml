[project]
name = "cloakroom"
version = "0.1.0"
description = "A local privacy gateway for AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0.2,<7",
]

[project.urls]
Repository = "https://github.com/nikhilvirdi/Cloakroom"

[project.scripts]
cloakroom = "cloakroom.cli:main"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1",
    "ruff>=0.15",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--cov=cloakroom", "--cov-report=term-missing"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["cloakroom"]

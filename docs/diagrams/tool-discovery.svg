<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 0 800 750" role="img" aria-labelledby="title desc">
  <title id="title">Cloakroom tool discovery</title>
  <desc id="desc">At startup, Cloakroom enumerates tools from configured MCP servers, builds a catalog and BM25 and MiniLM indexes, and identifies look-alike tools. At request time, discover_tools(query, max_tools) searches both indexes in parallel. Reciprocal rank fusion combines the rankings, and max_tools limits selection. Cloakroom builds cards from the selected catalog entries, adds disambiguation notes and configured relationship hints where applicable, and cloaks the cards before returning them to the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#fff"/>
    </marker>
  </defs>

  <g fill="none" stroke="#fff" stroke-linejoin="round">
    <rect x="14" y="14" width="772" height="259" rx="7"/>
    <rect x="14" y="303" width="772" height="433" rx="7"/>

    <!-- Startup components -->
    <rect x="36" y="62" width="222" height="87" rx="5"/>
    <rect x="286" y="62" width="224" height="87" rx="5"/>
    <rect x="554" y="62" width="210" height="87" rx="5"/>
    <rect x="36" y="196" width="222" height="56" rx="5"/>
    <rect x="286" y="196" width="224" height="56" rx="5"/>
    <rect x="554" y="196" width="210" height="56" rx="5"/>

    <!-- Request components -->
    <rect x="244" y="343" width="176" height="54" rx="5"/>
    <rect x="36" y="427" width="222" height="58" rx="5"/>
    <rect x="286" y="427" width="224" height="58" rx="5"/>
    <rect x="36" y="538" width="234" height="66" rx="5"/>
    <rect x="306" y="538" width="212" height="66" rx="5"/>
    <rect x="554" y="510" width="210" height="113" rx="5"/>
    <rect x="554" y="659" width="210" height="57" rx="5"/>
    <rect x="36" y="659" width="222" height="57" rx="5"/>

    <g marker-end="url(#arrow)">
      <path d="M258 106H286"/>
      <path d="M510 106H554"/>
      <path d="M659 149v22H147v25"/>
      <path d="M398 171v25"/>
      <path d="M510 224H554"/>

      <!-- Data reused from startup -->
      <path d="M36 224H25v232h11" stroke-dasharray="5 4"/>
      <path d="M440 252V427" stroke-dasharray="5 4"/>
      <path d="M659 252V510" stroke-dasharray="5 4"/>
      <path d="M764 106h11v465h-11" stroke-dasharray="5 4"/>

      <path d="M332 397v12h-88v18"/>
      <path d="M332 409h72v18"/>
      <path d="M147 485v53"/>
      <path d="M398 485v26H230v27"/>
      <path d="M270 571h36"/>
      <path d="M518 571h36"/>
      <path d="M659 623v36"/>
      <path d="M554 688H258"/>
    </g>
  </g>

  <g fill="#fff" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="600">
      <text x="34" y="41" text-anchor="start">Startup-time indexing</text>
      <text x="147" y="100">Downstream servers</text>
      <text x="398" y="100">Tool enumeration</text>
      <text x="659" y="82">Tool catalog</text>
      <text x="147" y="220">BM25 index</text>
      <text x="398" y="220">MiniLM index</text>
      <text x="659" y="220">Look-alike tools</text>

      <text x="34" y="329" text-anchor="start">Request-time retrieval</text>
      <text x="332" y="365">discover_tools</text>
      <text x="147" y="452">BM25 retrieval</text>
      <text x="398" y="452">Semantic retrieval</text>
      <text x="153" y="566">Reciprocal rank fusion</text>
      <text x="412" y="566">Top-K tool selection</text>
      <text x="659" y="535">Build tool cards</text>
      <text x="659" y="694">Cloak pipeline</text>
      <text x="147" y="694">Host</text>
    </g>
    <g font-size="15">
      <text x="147" y="120">Configured MCP endpoints</text>
      <text x="398" y="120">MCP tools/list</text>
      <text x="659" y="101"><tspan x="659">Names, descriptions</tspan><tspan x="659" dy="18">Parameter schemas</tspan><tspan x="659" dy="18">Effect classes</tspan></text>
      <text x="147" y="239">Tool text</text>
      <text x="398" y="239">all-MiniLM-L6-v2 vectors</text>
      <text x="659" y="239">Embedding similarity</text>

      <text x="332" y="385">(query, max_tools)</text>
      <text x="147" y="472">Exact vocabulary</text>
      <text x="398" y="472">Embedding similarity</text>
      <text x="153" y="586">RRF merges both rankings</text>
      <text x="412" y="586">Limited by max_tools</text>
      <text x="659" y="555">
        <tspan x="659">Schema rewriting</tspan>
        <tspan x="659" dy="18">Effect labels</tspan>
        <tspan x="659" dy="18">Disambiguation notes</tspan>
        <tspan x="659" dy="18">Configured relation hints</tspan>
      </text>
      <text x="406" y="678">Cloaked tool cards</text>
    </g>
  </g>
</svg>

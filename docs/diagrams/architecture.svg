    <rect x="556" y="182" width="208" height="66" rx="5"/>
    <rect x="48" y="298" width="196" height="78" rx="5"/>
    <rect x="296" y="298" width="208" height="78" rx="5"/>
    <rect x="556" y="298" width="208" height="78" rx="5"/>
    <rect x="48" y="420" width="196" height="64" rx="5"/>

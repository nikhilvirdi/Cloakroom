<svg xmlns="http://www.w3.org/2000/svg" width="800" height="665" viewBox="0 0 800 665" role="img" aria-labelledby="title desc">
  <title id="title">Cloakroom system architecture</title>
  <desc id="desc">The host connects the cloud model to the local Cloakroom gateway over MCP. Tool calls pass through policy and the client pool, and results go back through the cloak pipeline. Vault operations stay local. The user approves actions through the separate loopback Control Room, which also receives events from the gateway.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#fff"/>
    </marker>
  </defs>

  <g fill="none" stroke="#fff" stroke-linejoin="round">
    <rect x="48" y="18" width="196" height="60" rx="5"/>
    <rect x="296" y="18" width="208" height="60" rx="5"/>
    <rect x="556" y="18" width="208" height="60" rx="5"/>
    <rect x="14" y="139" width="772" height="386" rx="7"/>
    <rect x="48" y="182" width="196" height="66" rx="5"/>
